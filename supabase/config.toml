# Supabase CLI project config. Regenerate with `npx supabase init` if you ever need the full default file.
# Link to your hosted project with:  npx supabase link --project-ref <your-new-project-ref>
project_id = "supra-billing"

[api]
enabled = true
schemas = ["public"]

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
